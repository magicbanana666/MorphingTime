plugins {
    id 'maven-publish'
    // 26.x is unobfuscated: the non-remapping Loom plugin, no `mappings` dependency
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// -Ptarget=<mc> overrides the version block of gradle.properties with versions/<mc>.properties
def target = providers.gradleProperty('target').orNull
def mc = [:]
['minecraft_version', 'loader_version', 'fabric_api_version', 'minecraft_dep'].each { mc[it] = project.property(it).toString() }
if (target) {
    def f = file("versions/${target}.properties")
    if (!f.exists()) throw new GradleException("No versions/${target}.properties")
    def p = new Properties()
    f.withInputStream { p.load(it) }
    p.each { k, v -> mc[k.toString()] = v.toString() }
}

version = "${mc.minecraft_version}-${mod_version}"
group = mod_group
base.archivesName = "${mod_name}-FABRIC"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Keep build output out of OneDrive (it locks files while syncing): ~/.gradle-builds/<project-name>[-<target>]
def buildRoot = "${System.getProperty('user.home')}/.gradle-builds/${project.name}${target ? '-' + target : ''}"
layout.buildDirectory = file(buildRoot)

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    runs {
        configureEach {
            runDir = project.relativePath(file("${buildRoot}/run"))
        }
        client {
            // -Pquickplay=<world> loads straight into a singleplayer world (automated smoke tests)
            if (project.hasProperty('quickplay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplay').toString()
            }
        }
        server {
            programArgs '--nogui'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mc.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${mc.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${mc.fabric_api_version}"

    // -PextraMods=<jar>;<jar>: other mod jars to test compatibility with in the dev client
    if (project.hasProperty('extraMods')) {
        runtimeOnly files(project.property('extraMods').toString().split(';'))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    def props = [mod_id: mod_id, mod_display_name: mod_display_name, mod_version: mod_version,
                 loader_version: mc.loader_version, minecraft_dep: mc.minecraft_dep]
    inputs.properties props
    filesMatching('fabric.mod.json') {
        expand props
    }
}

jar {
    // the license must ship with the jar
    from('LICENSE.md')
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : 'magicbanana666',
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : 'magicbanana666'
        ])
    }
}
