modLoader="javafml"
loaderVersion="[1,)"
license="Don't Be an Asshole License"
issueTrackerURL="https://github.com/magicbanana666/MorphingTime/issues"

[[mixins]]
config="morphingtime-core.mixins.json"
[[mixins]]
config="morphingtime-core-neoforge.mixins.json"
[[mixins]]
config="morphingtime-shape.mixins.json"
[[mixins]]
config="morphingtime-shape-neoforge.mixins.json"
[[mixins]]
config="morphingtime-collection.mixins.json"
[[mixins]]
config="morphingtime-skin.mixins.json"

[[mods]]
modId="${mod_id}"
displayName="${mod_display_name}"
version="${mod_version}"
authors="magicbanana666"
displayURL="https://github.com/magicbanana666/MorphingTime"
logoFile="pack.png"
description='''Kill mobs to unlock them, then morph into them: their shape, size, health, abilities and traits. Everything in one jar, no dependencies.'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[${minecraft_version}]"
    ordering="NONE"
    side="BOTH"

# The separate mods are already inside this jar
[[dependencies.${mod_id}]]
    modId="woodwalkers"
    type="incompatible"
    reason="Walkers is already included in Morphing Time"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="walkers"
    type="incompatible"
    reason="Walkers is already included in Morphing Time"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="remorphed"
    type="incompatible"
    reason="ReMorphed is already included in Morphing Time"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="craftedcore"
    type="incompatible"
    reason="CraftedCore is already included in Morphing Time"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="morphreinvented"
    type="incompatible"
    reason="Morphing Time replaces Morph Reinvented"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="skinshifter"
    type="incompatible"
    reason="SkinShifter is already included in Morphing Time"
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"
